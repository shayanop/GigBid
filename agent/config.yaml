# GigBid runtime configuration. Agent code reads every model choice, threshold,
# budget and fee assumption from here; nothing below is hard-coded in nodes.

profile: open # override with GIGBID_PROFILE

# Model specs are "provider:model" (passed to langchain init_chat_model).
# Nodes not listed under `nodes` use `default`, and fall back to
# `default_fallback` on errors (cheap nodes only).
profiles:
  open: # deployed profile: open-weight models served by Groq
    default: groq:openai/gpt-oss-20b
    default_fallback: groq:openai/gpt-oss-120b
    nodes:
      writer: groq:openai/gpt-oss-120b
      critic: groq:openai/gpt-oss-120b
      liaison: groq:openai/gpt-oss-120b

  open_alt: # second open configuration for the model comparison: small model everywhere
    default: groq:openai/gpt-oss-20b
    default_fallback: groq:openai/gpt-oss-120b

  local: # small nodes on the compose Ollama service, heavy nodes on Groq
    default: ollama:qwen3:4b
    default_fallback: groq:openai/gpt-oss-20b
    nodes:
      writer: groq:openai/gpt-oss-120b
      critic: groq:openai/gpt-oss-120b
      liaison: groq:openai/gpt-oss-120b

marketplace:
  adapter: gigsim # gigsim | upwork

rag: # deployed retrieval pipeline; change only from evals/results evidence (R6)
  variant: v0
  embedding_model: BAAI/bge-small-en-v1.5
  chunk_size: 800 # characters, V0 fixed-size chunking
  chunk_overlap: 100

# Initial values; retune from evals/results.
decision:
  bid_min_fit: 0.70
  watch_min_fit: 0.50
  bid_max_risk: 0.40

critic:
  max_revisions: 2
  min_words: 60
  max_words: 250

pricing:
  hourly_rate_floor: 40 # USD; per-user settings override this later
  fixed_bid_floor: 300
  assumed_hours: 40 # to value hourly jobs
  win_rate_at_full_fit: 0.25

policy_pack: data/policy_pack

budgets: # per graph thread; exhaustion -> needs_attention
  max_steps: 40
  max_tokens: 60000
  node_timeout_seconds: 120
  retry_initial_seconds: 1.0 # node retries back off from here (3 attempts)

worker:
  max_jobs: 2 # concurrent graph runs; Groq's free tier rate-limits beyond this
  orphan_after_minutes: 20 # re-queue threads whose queue entry was lost
  replay_delay_minutes: 5 # wait before replaying a run that hit an outage or rate limit
  max_replays: 3

scouting: # conservative: saved searches run at most every 15 minutes (DB constraint)
  first_run_limit: 5 # newest jobs taken the first time a saved search runs
  per_run_limit: 10

targets: # declared latency/cost budgets (R8, E5)
  p95_analyze_seconds: 20
  p95_proposal_seconds: 60
  usd_per_analyzed_job: 0.01
  usd_per_proposal: 0.05

fees: # marketplace assumptions; update here when GigSim policy changes
  connect_price_usd: 0.15
  platform_fee_pct: 10
