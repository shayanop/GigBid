# Local stack: docker compose -f infra/docker-compose.yml --env-file .env up
# The web app is added with Phase 6.
name: gigbid

x-python: &python
  build:
    context: ..
    dockerfile: infra/docker/python.Dockerfile

x-app-env: &app-env
  DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  REDIS_URL: redis://redis:6379/0
  SESSION_SECRET: ${SESSION_SECRET}
  MCP_SIGNING_SECRET: ${MCP_SIGNING_SECRET}
  MARKETPLACE_MCP_URL: http://marketplace-mcp:8200/mcp
  PORTFOLIO_MCP_URL: http://portfolio-mcp:8300/mcp
  GROQ_API_KEY: ${GROQ_API_KEY}
  GIGBID_PROFILE: ${GIGBID_PROFILE:-open}
  OLLAMA_HOST: http://ollama:11434
  DEMO_EMAIL: ${DEMO_EMAIL}
  DEMO_PASSWORD: ${DEMO_PASSWORD}

services:
  api:
    <<: *python
    command: uvicorn apps.api.main:app --host 0.0.0.0 --port 8000
    environment: *app-env
    ports: ["8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_started}

  worker: # scheduled scouting and every graph run
    <<: *python
    command: python -m worker.main
    environment: *app-env
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_started}
      marketplace-mcp: {condition: service_started}
      portfolio-mcp: {condition: service_started}

  gigsim: # marketplace simulator
    <<: *python
    command: uvicorn gigsim.app:create_app --factory --host 0.0.0.0 --port 8100
    ports: ["8100:8100"]

  marketplace-mcp:
    <<: *python
    command: python -m mcp_servers.marketplace.server
    environment:
      HOST: 0.0.0.0
      GIGSIM_URL: http://gigsim:8100
      MARKETPLACE_MCP_URL: http://marketplace-mcp:8200/mcp
      MCP_SIGNING_SECRET: ${MCP_SIGNING_SECRET}
      MARKETPLACE_AUDIT_LOG: /audit/marketplace.jsonl
    volumes: [audit:/audit]
    ports: ["8200:8200"]
    depends_on: [gigsim]

  portfolio-mcp:
    <<: *python
    command: python -m mcp_servers.portfolio.server
    environment:
      HOST: 0.0.0.0
      PORTFOLIO_MCP_URL: http://portfolio-mcp:8300/mcp
      MCP_SIGNING_SECRET: ${MCP_SIGNING_SECRET}
      FASTEMBED_CACHE_PATH: /models
    volumes: [models:/models, index:/app/data/processed/index]
    ports: ["8300:8300"]

  postgres: # relational data, LangGraph checkpoints/store, pgvector
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    ports: ["6379:6379"]

  ollama: # serves the `local` model profile
    image: ollama/ollama:0.40.11
    ports: ["11434:11434"]
    volumes: [ollama:/root/.ollama]

  phoenix: # tracing UI on :6006, OTLP collector on :4317
    image: arizephoenix/phoenix:version-20.26.1
    ports: ["6006:6006", "4317:4317"]

volumes:
  audit:
  index:
  models:
  pgdata:
  ollama:
