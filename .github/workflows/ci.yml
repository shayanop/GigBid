name: ci

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env: {POSTGRES_USER: gigbid, POSTGRES_PASSWORD: ci-only, POSTGRES_DB: gigbid_test}
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U gigbid" --health-interval 5s --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
    env:
      TEST_DATABASE_URL: postgresql://gigbid:ci-only@localhost:5432/gigbid_test
      TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run pytest -m "not live"

  web:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env: {POSTGRES_USER: gigbid, POSTGRES_PASSWORD: ci-only, POSTGRES_DB: gigbid_test}
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U gigbid" --health-interval 5s --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
    env:
      TEST_DATABASE_URL: postgresql://gigbid:ci-only@localhost:5432/gigbid_test
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
      - run: uv sync --locked
        working-directory: .
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: Generated API client matches the API
        run: npm run gen:api && git diff --exit-code -- openapi.json src/lib/api
      - run: npx next typegen && npx tsc --noEmit
      - run: npm run lint
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: apps/web/playwright-report

  eval-smoke: # E2: 30 jobs and 3 proposals with real models, gated by eval_gates in agent/config.yaml
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      GIGBID_PROFILE: cerebras
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
    steps:
      - uses: actions/checkout@v7
      - name: Model keys present
        id: keys
        run: |
          if [ -n "$GROQ_API_KEY" ] && [ -n "$CEREBRAS_API_KEY" ]; then echo "ok=1" >> "$GITHUB_OUTPUT"
          else echo "::notice::GROQ_API_KEY / CEREBRAS_API_KEY secrets not set (or a fork PR): smoke eval skipped"; fi
      - uses: astral-sh/setup-uv@v10.3.2
        if: steps.keys.outputs.ok == '1'
      - if: steps.keys.outputs.ok == '1'
        run: uv sync --locked
      - if: steps.keys.outputs.ok == '1'
        run: uv run python -m evals.runners.smoke
      - uses: actions/upload-artifact@v7
        if: always() && steps.keys.outputs.ok == '1'
        with:
          name: smoke-eval
          path: evals/results/smoke.json

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
