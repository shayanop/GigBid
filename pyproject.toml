[project]
name = "gigbid"
version = "0.1.0"
description = "Multi-agent freelancer copilot"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.162.0",
    "fastembed>=0.9.1",
    "httpx>=0.28.1",
    "langchain>=1.4.7",
    "langchain-groq>=1.1.3",
    "langchain-ollama>=1.1.0",
    "langgraph>=1.2.17",
    "langgraph-checkpoint-postgres>=3.2.0",
    "mcp>=2.3.0",
    "numpy>=2.4.6",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.1",
    "pypdf>=6.21.2",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "fpdf2>=2.8.9",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.1",
    "ruff>=0.17.2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests", "mcp_servers"]
asyncio_mode = "auto"
markers = [
    "live: calls a real model API (needs GROQ_API_KEY)",
    "postgres: needs DATABASE_URL pointing at a Postgres server",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["data/personas/*/repos"]  # synthetic corpus snippets, not code

[tool.ruff.lint.per-file-ignores]
# MCP tool params are validated by pydantic, which copies list defaults per call.
"mcp_servers/*/server.py" = ["B006"]
