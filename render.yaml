# Render Blueprint for the public GigBid demo (docs/DEPLOY.md).
# Two Docker services: the web app, and a backend that runs the API, worker, GigSim and the
# three MCP servers in one container (infra/render/start.sh). Postgres and Key Value are
# managed by Render. Secrets marked sync: false are asked for when the Blueprint is created.
services:
  - type: web
    name: gigbid-backend
    runtime: docker
    dockerfilePath: ./infra/docker/python.Dockerfile
    dockerContext: .
    dockerCommand: ./infra/render/start.sh
    plan: standard # 2 GB: six Python processes plus the embedding model
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: gigbid-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: gigbid-queue
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: MCP_SIGNING_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: "1"
      - key: GIGBID_PROFILE
        value: cerebras # nodes spread over Groq and Cerebras rate limits (docs/RUNBOOK.md)
      - key: GROQ_API_KEY
        sync: false
      - key: CEREBRAS_API_KEY
        sync: false
      - key: NIM_API_KEY # only the nim profile uses it
        sync: false
      - key: PHOENIX_COLLECTOR_ENDPOINT # optional: Phoenix Cloud or self-hosted, e.g. https://app.phoenix.arize.com/s/<space>
        sync: false
      - key: OTEL_EXPORTER_OTLP_HEADERS # optional: the auth header Phoenix Cloud's setup page gives
        sync: false
      - key: DEMO_EMAIL # the demonstration login, seeded on every start
        sync: false
      - key: DEMO_PASSWORD
        sync: false

  - type: web
    name: gigbid-web
    runtime: docker
    dockerfilePath: ./infra/docker/web.Dockerfile
    dockerContext: .
    plan: starter
    envVars:
      - key: API_URL # private-network host:port of the backend, baked in at build time
        fromService:
          type: web
          name: gigbid-backend
          property: hostport

  - type: keyvalue # Arq job queue
    name: gigbid-queue
    plan: free
    maxmemoryPolicy: noeviction # a queue must not drop jobs
    ipAllowList: [] # private network only

databases:
  - name: gigbid-db
    plan: basic-256mb
    databaseName: gigbid
    user: gigbid
    ipAllowList: [] # private network only
